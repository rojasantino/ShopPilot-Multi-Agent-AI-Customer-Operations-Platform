name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: shoppilot}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run: {working-directory: backend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/shoppilot
      - run: python -m evals.run_routing_eval
        env: {PYTHONPATH: .}

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend -t shoppilot-api
      - run: docker build ./frontend -t shoppilot-ui
