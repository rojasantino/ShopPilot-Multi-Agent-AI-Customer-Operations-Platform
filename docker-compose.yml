services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: shoppilot
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["${DB_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shoppilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      args:
        REQUIREMENTS: ${API_REQUIREMENTS:-requirements.txt}
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/shoppilot
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]

  ui:
    build: ./frontend
    environment:
      API_URL: http://api:8000
      API_KEY: ${API_KEY:-change-me-dev-key}
    depends_on: [api]
    ports: ["8501:8501"]

volumes:
  pgdata:
